syntax = "proto3";

package library;

// option python_package = "library_server";

message Book {
  int32 id = 1;
  string title = 2;
  string author = 3;
  string isbn = 4;
  bool available = 5;
}

message Member {
  int32 id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
}

message Loan {
  int32 id = 1;
  int32 member_id = 2;
  int32 book_id = 3;
  string borrowed_at = 4;
  string due_at = 5;
  string returned_at = 6;
}

/************ BOOKS ************/

message CreateBookRequest {
  string title = 1;
  string author = 2;
  string isbn = 3;
}

message UpdateBookRequest {
  int32 id = 1;
  string title = 2;
  string author = 3;
  string isbn = 4;
  bool available = 5;
}

message BookResponse {
  Book book = 1;
}

message ListBooksRequest {
  bool only_available = 1;
}

message ListBooksResponse {
  repeated Book books = 1;
}

/************ MEMBERS ************/

message CreateMemberRequest {
  string name = 1;
  string email = 2;
  string phone = 3;
}

message UpdateMemberRequest {
  int32 id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
}

message MemberResponse {
  Member member = 1;
}

message ListMembersRequest {}

message ListMembersResponse {
  repeated Member members = 1;
}

/************ BORROW / RETURN ************/

message BorrowBookRequest {
  int32 member_id = 1;
  int32 book_id = 2;
  string due_at = 3; // ISO string, optional
}

message BorrowBookResponse {
  Loan loan = 1;
}

message ReturnBookRequest {
  int32 book_id = 1;
}

message ReturnBookResponse {
  Loan loan = 1;
}

message ListBorrowedBooksByMemberRequest {
  int32 member_id = 1;
}

message ListBorrowedBooksByMemberResponse {
  repeated Book books = 1;
}

/************ SERVICE ************/

service LibraryService {
  // Books
  rpc CreateBook (CreateBookRequest) returns (BookResponse);
  rpc UpdateBook (UpdateBookRequest) returns (BookResponse);
  rpc ListBooks (ListBooksRequest) returns (ListBooksResponse);

  // Members
  rpc CreateMember (CreateMemberRequest) returns (MemberResponse);
  rpc UpdateMember (UpdateMemberRequest) returns (MemberResponse);
  rpc ListMembers (ListMembersRequest) returns (ListMembersResponse);

  // Borrow / Return
  rpc BorrowBook (BorrowBookRequest) returns (BorrowBookResponse);
  rpc ReturnBook (ReturnBookRequest) returns (ReturnBookResponse);
  rpc ListBorrowedBooksByMember (ListBorrowedBooksByMemberRequest)
      returns (ListBorrowedBooksByMemberResponse);
}
